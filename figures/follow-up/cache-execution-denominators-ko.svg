<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="0 0 1040 900" role="img" aria-labelledby="title desc">
<title id="title">Cache 실행 분모와 무효 중단</title>
<desc id="desc">사이클, 실행 묶음, 과제 실행의 계획과 관측을 서로 다른 단위로 표시하고, 선행 요청이 없었던 논리 요청 순번 3의 제공자 전송 전 중단을 보인다.</desc>
<metadata>source-report-sha256:9c07682a067aea18d253c869f5fe0711dc3c695de5b1636b7bfe7d95b0f907f3</metadata>
