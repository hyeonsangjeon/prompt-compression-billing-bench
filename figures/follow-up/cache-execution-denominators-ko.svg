<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1152" viewBox="0 0 390 1152" role="img" aria-labelledby="title desc">
<title id="title">Cache 비교: 계획, 부분 실행과 중단</title>
<desc id="desc">사이클, 실행 묶음, 과제 실행의 계획과 관측을 단위별로 비교하고, 선행 요청이 없었던 논리 요청 순번 3에서 현재 요청을 제공자 전송 전에 거부한 흐름을 보여 준다.</desc>
<metadata>source-report-sha256:9639c2f21142378727082d0b3b142348b15941b8e1c538232c9b10f5075f058c</metadata>
<rect width="390" height="1152" fill="#ffffff"/>
<g font-family="sans-serif" font-variant-numeric="tabular-nums">
<text x="18" y="38" font-size="24" font-weight="700" fill="#17202a">Cache 비교가 멈춘 지점</text>
<text x="18" y="68" font-size="18" font-weight="400" fill="#44515f">계획과 관측을 같은 단위 안에서 비교</text>
<text x="18" y="108" font-size="20" font-weight="700" fill="#17202a">계획과 관측</text>
<rect x="18" y="124" width="354" height="114" rx="12" fill="#f7f9fb" stroke="#7a8794" stroke-width="2"/>
<text x="34" y="152" font-size="20" font-weight="700" fill="#17202a">사이클</text>
<text x="34" y="180" font-size="18" font-weight="700" fill="#2457a6">계획 · 유효 10개</text>
<text x="34" y="206" font-size="18" font-weight="400" fill="#17202a">관측 · 1개 시도 · 0개 유효</text>
<text x="34" y="228" font-size="18" font-weight="400" fill="#17202a">1개 무효 · 대체 0개</text>
<rect x="18" y="248" width="354" height="114" rx="12" fill="#f7f9fb" stroke="#7a8794" stroke-width="2"/>
<text x="34" y="276" font-size="20" font-weight="700" fill="#17202a">실행 묶음</text>
<text x="34" y="304" font-size="18" font-weight="700" fill="#2457a6">계획 · 60개</text>
<text x="34" y="330" font-size="18" font-weight="400" fill="#17202a">관측 · 2개 시작 · 1개 완결</text>
<text x="34" y="352" font-size="18" font-weight="400" fill="#17202a">1개 미완결·무효</text>
<rect x="18" y="372" width="354" height="114" rx="12" fill="#f7f9fb" stroke="#7a8794" stroke-width="2"/>
<text x="34" y="400" font-size="20" font-weight="700" fill="#17202a">과제 실행</text>
<text x="34" y="428" font-size="18" font-weight="700" fill="#2457a6">계획 · 300개</text>
<text x="34" y="454" font-size="18" font-weight="400" fill="#17202a">관측 · 6개 시작 · 5개 완결</text>
<text x="34" y="476" font-size="18" font-weight="400" fill="#17202a">1개 미완결</text>
<text x="18" y="522" font-size="20" font-weight="700" fill="#17202a">짝이 없는 요청에서 멈춘 순서</text>
<rect x="18" y="544" width="354" height="82" rx="10" fill="#ffffff" stroke="#52708f" stroke-width="2"/>
<text x="195" y="569" font-size="18" font-weight="700" fill="#17202a" text-anchor="middle">1. 선행 실행</text>
<text x="195" y="592" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">none · 재사용 0</text>
<text x="195" y="615" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">선행 요청 2개</text>
<path d="M195,628 V640" stroke="#44515f" stroke-width="3"/>
<path d="M195,643 l-6,-9 h12 z" fill="#44515f"/>
<rect x="18" y="644" width="354" height="82" rx="10" fill="#ffffff" stroke="#52708f" stroke-width="2"/>
<text x="195" y="669" font-size="18" font-weight="700" fill="#17202a" text-anchor="middle">2. 현재 실행</text>
<text x="195" y="692" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">none · 재사용 1</text>
<text x="195" y="715" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">cancel-async-tasks · 순번 3</text>
<path d="M195,728 V740" stroke="#44515f" stroke-width="3"/>
<path d="M195,743 l-6,-9 h12 z" fill="#44515f"/>
<rect x="18" y="744" width="354" height="82" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
<text x="195" y="769" font-size="18" font-weight="700" fill="#17202a" text-anchor="middle">3. 비교 쌍 없음</text>
<text x="195" y="792" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">선행 실행에는 요청 2개</text>
<text x="195" y="815" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">순번 3의 선행 요청 없음</text>
<path d="M195,828 V840" stroke="#44515f" stroke-width="3"/>
<path d="M195,843 l-6,-9 h12 z" fill="#44515f"/>
<rect x="18" y="844" width="354" height="82" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
<text x="195" y="869" font-size="18" font-weight="700" fill="#17202a" text-anchor="middle">4. 검증 중단</text>
<text x="195" y="892" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">현재 요청을 제공자 전송 전 거부</text>
<text x="195" y="915" font-size="18" font-weight="400" fill="#17202a" text-anchor="middle">접두부 차이·길이 측정 없음</text>
<text x="18" y="946" font-size="20" font-weight="700" fill="#17202a">부분 실행이 말해 주는 범위</text>
<rect x="18" y="962" width="354" height="170" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="34" y="990" font-size="18" font-weight="700" fill="#7c2d12">부분 실행 설명값</text>
<text x="34" y="1014" font-size="18" font-weight="400" fill="#17202a">성공한 제공자 응답 18회</text>
<text x="34" y="1038" font-size="18" font-weight="400" fill="#44515f">완결 과제: 3/5 통과</text>
<text x="34" y="1062" font-size="18" font-weight="700" fill="#7c2d12">유효 사이클 0개</text>
<text x="34" y="1086" font-size="18" font-weight="700" fill="#7c2d12">Cache·재사용 효과 계산 안 함</text>
<text x="34" y="1110" font-size="18" font-weight="700" fill="#7c2d12">압축 효과 계산 안 함</text>
</g></svg>
