<title id="title">SWE-Lancer 실행: 유효 기록과 모델 평가 전 중단</title>
<desc id="desc">고정 실행 1회 계획과 관측된 실행 결과 묶음 2개를 순서대로 보여 준다. 두 묶음은 모두 모델·채점기 호출 전 격리 실행 환경 시작 시간 초과로 끝났다.</desc>
