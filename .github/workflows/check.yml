name: Record contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test accounting and failure contracts without model calls
        run: python -m unittest discover -s tests -v
      - name: Check recorded evidence in both directions
        run: |
          for file in evidence/*.json; do
            python evidence.py check "$file"
          done
      - name: Refuse files without a publication grade
        run: python evidence.py audit-files .
