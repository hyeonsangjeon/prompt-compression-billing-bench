# Static benchmark dependencies are pinned; provider-backed execution is opt-in.
[project]
name = "prompt-compression-billing-bench"
version = "0.0.1"
description = "Hash-bound log compression measurements, separate from provider usage."
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0", "numpy==2.3.3", "pyyaml==6.0.3", "tiktoken==0.14.0"]

[project.optional-dependencies]
native = ["harbor==0.22.0"]

[tool.uv]
package = false
