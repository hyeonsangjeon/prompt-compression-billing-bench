schema_version = 2
mode = "frozen_static"
output_dir = "runs"

[inputs]
root_env = "FROZEN_INPUT_ROOT"
manifest_sha256 = "5a8c238d86543c8bd0d48380c7744cfdb89f0c3ef9f9de759ab082268f0f466a"
dataset = "synthetic-contract-example"
kind = "synthetic_fixture"
tasks = ["synthetic-contract-example"]
historical_runs = 1
request_count = 1
candidate_segments = 1
protected_segments = 2

[execution]
passes = 1
judge = "not_run"
request_settings = "preserve_exactly"
concurrency = 1

[compressor]
name = "none"
target = "identified_log_spans"

[compressor.tools.none]
version = "unavailable"
options = {}

[compressor.tools.squeez]
version = "1.48.4"
